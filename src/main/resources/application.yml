server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    # Railway's PostgreSQL variables. DATABASE_URL is not used because Railway provides it as postgresql://, not jdbc:.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ledger}
    username: ${PGUSER:ledger}
    password: ${PGPASSWORD:ledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

ledger:
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
  # One long random string (32+ characters). JWT signing and authenticator-secret encryption keys are derived from it.
  # Changing it signs everyone out AND makes stored authenticator secrets unreadable (reset users to re-enrol).
  secret: ${APP_SECRET:}
  # Refresh cookie is Secure (HTTPS only). Browsers still allow it on http://localhost for development.
  cookie-secure: ${COOKIE_SECURE:true}
  # Only used when the users table is empty. Remove after first sign-in.
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # Railway Storage Bucket (S3-compatible). Leave ENDPOINT unset to run without a bucket.
  storage:
    endpoint: ${ENDPOINT:}
    region: ${REGION:auto}
    bucket: ${BUCKET:}
    access-key-id: ${ACCESS_KEY_ID:}
    secret-access-key: ${SECRET_ACCESS_KEY:}
